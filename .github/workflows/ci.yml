name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push supersedes any still-running build of the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and test
          run: |
            set -o pipefail
            xcodebuild test \
              -project Wording.xcodeproj \
              -scheme Wording \
              -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
              CODE_SIGNING_ALLOWED=NO \
              | xcbeautify --renderer github-actions

  # Placeholder for the deployment leg. Uploading to TestFlight requires an
  # Apple Developer Program membership plus repo secrets (signing certificate,
  # provisioning profile, App Store Connect API key); enable this job once
  # those exist.
